[project]
name = "content-factory"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # Верхняя граница обязательна: gf/mcp_server.py использует API 1.x
  # (mcp.server.fastmcp.FastMCP), в 2.x он переименован. Без ограничения
  # установка с нуля ставит 2.x и падает при запуске шлюза.
  "mcp>=1.2,<2",
  "typer>=0.12",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "anthropic>=0.50",
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gf = "gf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gf*"]

[tool.setuptools.package-data]
gf = ["workflows/*.json", "promptdocs/**/*.md"]

[tool.pytest.ini_options]
markers = ["live: hits a real external service (ComfyUI/Nitro); skipped by default"]
